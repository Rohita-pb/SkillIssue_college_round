x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
  AGENTBREAK_JWT_PUBLIC_KEY: ${AGENTBREAK_JWT_PUBLIC_KEY:-}
  AGENTBREAK_JWT_SECRET: ${AGENTBREAK_JWT_SECRET:-}
  AGENTBREAK_JWT_ISSUER: ${AGENTBREAK_JWT_ISSUER:-agentbreak}
  AGENTBREAK_JWT_AUDIENCE: ${AGENTBREAK_JWT_AUDIENCE:-agentbreak-api}
  AGENTBREAK_CORS_ORIGINS: ${AGENTBREAK_CORS_ORIGINS:?AGENTBREAK_CORS_ORIGINS must be set}
  AGENTBREAK_AUDIT_SIGNING_SECRET: ${AGENTBREAK_AUDIT_SIGNING_SECRET:-}
  AGENTBREAK_AUDIT_SIGNING_KEY_ID: ${AGENTBREAK_AUDIT_SIGNING_KEY_ID:-}
  AGENTBREAK_AWS_KMS_KEY_ID: ${AGENTBREAK_AWS_KMS_KEY_ID:-}
  AWS_REGION: ${AWS_REGION:-}
  AGENTBREAK_MODEL_BASE_URL: ${AGENTBREAK_MODEL_BASE_URL:-}
  AGENTBREAK_MODEL_NAME: ${AGENTBREAK_MODEL_NAME:-}
  AGENTBREAK_MODEL_API_KEY: ${AGENTBREAK_MODEL_API_KEY:-}
  AGENTBREAK_MODEL_LABEL: ${AGENTBREAK_MODEL_LABEL:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentbreak}
      POSTGRES_USER: ${POSTGRES_USER:-agentbreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      <<: *app-environment
      PORT: 3001
      AGENTBREAK_OPERATOR_TOKEN: ${AGENTBREAK_OPERATOR_TOKEN:-}
      AGENTBREAK_GATEWAY_TOKEN: ${AGENTBREAK_GATEWAY_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          import('ioredis').then(async ({default: Redis}) => {
          const client = new Redis(process.env.REDIS_URL, {lazyConnect: true, maxRetriesPerRequest: 1, connectTimeout: 2000});
          try { await client.connect(); await client.zremrangebyscore('agentbreak:worker:heartbeats', '-inf', Date.now() - 30000);
          const healthy = (await client.zcard('agentbreak:worker:heartbeats')) > 0; await client.quit(); process.exit(healthy ? 0 : 1); }
          catch { client.disconnect(); process.exit(1); }
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
