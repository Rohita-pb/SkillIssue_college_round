services:
  # AgentBreak API & Frontend Web Service
  - type: web
    name: agentbreak-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentbreak-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentbreak-redis
          property: connectionString
      - key: AGENTBREAK_JWT_SECRET
        generateValue: true
      - key: AGENTBREAK_JWT_ISSUER
        value: agentbreak
      - key: AGENTBREAK_JWT_AUDIENCE
        value: agentbreak-api
      - key: AGENTBREAK_CORS_ORIGINS
        sync: false
      - key: AGENTBREAK_AUDIT_SIGNING_SECRET
        generateValue: true
      - key: AGENTBREAK_AUDIT_SIGNING_KEY_ID
        value: key_render_v1
    healthCheckPath: /api/health/live

  # AgentBreak Asynchronous BullMQ Worker
  - type: worker
    name: agentbreak-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentbreak-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentbreak-redis
          property: connectionString
      - key: AGENTBREAK_JWT_SECRET
        fromService:
          type: web
          name: agentbreak-api
          envVarKey: AGENTBREAK_JWT_SECRET
      - key: AGENTBREAK_AUDIT_SIGNING_SECRET
        fromService:
          type: web
          name: agentbreak-api
          envVarKey: AGENTBREAK_AUDIT_SIGNING_SECRET

databases:
  - name: agentbreak-db
    databaseName: agentbreak
    user: agentbreak
    plan: standard

  - type: redis
    name: agentbreak-redis
    ipAllowList: []
    plan: standard
