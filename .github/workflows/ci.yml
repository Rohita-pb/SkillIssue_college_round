name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm test
      - run: npm run build:all
      - name: Validate production compose
        run: >-
          POSTGRES_PASSWORD=agentbreak-ci-password
          DATABASE_URL=postgresql://agentbreak:agentbreak-ci-password@postgres:5432/agentbreak
          REDIS_URL=redis://redis:6379
          AGENTBREAK_JWT_SECRET=agentbreak-ci-jwt-secret-that-is-at-least-32-chars
          AGENTBREAK_CORS_ORIGINS=https://ci.example.test
          AGENTBREAK_AUDIT_SIGNING_SECRET=agentbreak-ci-audit-secret-that-is-at-least-32-chars
          docker compose -f docker-compose.production.yml config
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
